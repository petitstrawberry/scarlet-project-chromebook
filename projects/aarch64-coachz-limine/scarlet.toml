schema_version = 2

[project]
name = "scarlet-aarch64-coachz-limine"

[hooks.post-image]
command = "tools/inject-limine-efi.sh"

[bsp]
path = "bsp"
package = "scarlet"

[bsp.kernel]
source = { path = "../../../Scarlet/kernel" }
features = { network = true, user-fpu = true, user-vector = true, hypervisor = false, limine = true, sync-debug = true }

[modules]
"scarlet-driver-qcom-sc7180-tlmm" = { path = "../../drivers/gpio/qcom-sc7180-tlmm", enabled = true }
"scarlet-driver-qcom-geni-i2c" = { path = "../../drivers/i2c/qcom-geni", enabled = true }
"scarlet-driver-qcom-geni-spi" = { path = "../../drivers/spi/qcom-geni", enabled = true }
"scarlet-driver-google-cr50-tpm2-rng" = { path = "../../drivers/rng/google-cr50-tpm2", enabled = true }
"scarlet-driver-cros-ec-spi" = { path = "../../drivers/platform/chromeos/cros-ec-spi", enabled = true }
"scarlet-driver-qcom-spmi-pmic-arb" = { path = "../../drivers/spmi/qcom-spmi-pmic-arb", enabled = true }
"scarlet-driver-qcom-pm8941-rtc" = { path = "../../drivers/rtc/qcom-pm8941-rtc", enabled = true }
"scarlet-driver-qcom-sc7180-gcc-display" = { path = "../../drivers/clk/qcom-sc7180-gcc-display", enabled = true }
"scarlet-driver-qcom-cmd-db" = { path = "../../drivers/soc/qcom-cmd-db", enabled = true }
"scarlet-driver-qcom-rpmh-rsc" = { path = "../../drivers/soc/qcom-rpmh-rsc", enabled = true }
"scarlet-driver-qcom-sc7180-rpmhcc" = { path = "../../drivers/clk/qcom-sc7180-rpmhcc", enabled = true }
"scarlet-driver-qcom-sc7180-cpufreq-hw" = { path = "../../drivers/cpufreq/qcom-sc7180-hw", enabled = true }
"scarlet-driver-qcom-sc7180-rpmhpd" = { path = "../../drivers/pmdomain/qcom-sc7180-rpmhpd", enabled = true }
"scarlet-driver-qcom-sc7180-lpasscc" = { path = "../../drivers/clk/qcom-sc7180-lpasscc", enabled = true }
"scarlet-driver-qcom-sc7180-interconnect" = { path = "../../drivers/interconnect/qcom-sc7180", enabled = true }
"scarlet-driver-qcom-sc7180-gpucc" = { path = "../../drivers/clk/qcom-sc7180-gpucc", enabled = true }
"scarlet-driver-qcom-adreno-a618" = { path = "../../drivers/gpu/qcom-adreno-a618", enabled = true }
"scarlet-driver-qcom-sc7180-videocc" = { path = "../../drivers/clk/qcom-sc7180-videocc", enabled = true }
"scarlet-driver-qcom-venus-sc7180" = { path = "../../drivers/video/qcom-venus-sc7180", enabled = true }
"scarlet-driver-max98360a" = { path = "../../drivers/audio/codecs/max98360a", enabled = true }
"scarlet-driver-qcom-sc7180-lpass" = { path = "../../drivers/audio/qcom-sc7180-lpass", enabled = true }
"scarlet-driver-google-sc7180-trogdor-audio" = { path = "../../drivers/audio/google-sc7180-trogdor", enabled = true }
"scarlet-driver-qcom-sc7180-dispcc" = { path = "../../drivers/clk/qcom-sc7180-dispcc", enabled = true }
"scarlet-driver-qcom-sc7180-qfprom" = { path = "../../drivers/nvmem/qcom-sc7180-qfprom", enabled = true }
"scarlet-driver-qcom-qusb2-v2" = { path = "../../drivers/phy/qcom-qusb2-v2", enabled = true }
"scarlet-driver-qcom-qmp-usb3-dp" = { path = "../../drivers/phy/qcom-qmp-usb3-dp", enabled = true }
"scarlet-driver-qcom-dwc3" = { path = "../../drivers/usb/dwc3/qcom-dwc3", enabled = true }
"scarlet-driver-chrome-ec-usb-touchpad" = { path = "../../drivers/input/trackpad/chrome-ec-usb-touchpad", enabled = true }
"scarlet-driver-chrome-ec-mkbp-switch" = { path = "../../drivers/input/switch/chrome-ec-mkbp-switch", enabled = true }
"scarlet-driver-goodix-gt7375p" = { path = "../../drivers/input/touchscreen/goodix-gt7375p", enabled = true }
"scarlet-driver-ti-sn65dsi86" = { path = "../../drivers/display/bridge/ti-sn65dsi86", enabled = true }
"scarlet-driver-qcom-sc7180-mdss" = { path = "../../drivers/display/qcom-sc7180-mdss", enabled = true }
"scarlet-driver-qcom-sdhci-sc7180" = { path = "../../drivers/mmc/qcom-sdhci-sc7180", enabled = true }

[images]

[images.initramfs]
format = "newc"
output = ".scarlet/images/initramfs-aarch64-coachz.cpio"

[[images.initramfs.layers]]
kind = "bundle"
path = "../../../Scarlet/bundles/base/bundle.toml"

[[images.initramfs.layers]]
kind = "bundle"
path = "../../../Scarlet/bundles/cli-utils/bundle.toml"

# Kernel drivers use the global VFS, whose root remains the initramfs after
# userspace pivots to the block root. Keep firmware available in that trusted
# namespace as well as in the persistent rootfs below.
[[images.initramfs.layers]]
kind = "copy"
source = "firmware/rootfs"
to = "/system/scarlet"

# The project-local PID 1 patches the resolved Scarlet init with rootwait
# semantics while retaining its root transition and non-rootwait fallback.
[[images.initramfs.layers]]
kind = "cargo"
source = { path = "rootwait-init" }
package = "scarlet-rootwait-init"
bin = "init"
replace = true
to = "/system/scarlet/bin/init"

[images.rootfs]
format = "ext2"
output = ".scarlet/images/rootfs-aarch64-coachz-full.ext2"

[[images.rootfs.layers]]
kind = "bundle"
path = "../../../Scarlet/bundles/full/bundle.toml"

[[images.rootfs.layers]]
kind = "copy"
source = "firmware/rootfs"
to = "/system/scarlet"

# The generic Scarlet bundle is intentionally backend-neutral and keeps its
# Adreno crates pinned to a published git revision.  During CoachZ driver
# development, rebuild the binaries that actually submit A6xx commands against
# this checkout so userspace and the in-tree kernel validator cannot drift.
[[images.rootfs.layers]]
kind = "script"
source = "tools/build-coachz-sgfx-userspace.sh"
to = "/system/scarlet/bin"

[images.boot]
format = "limine-uefi"
output = ".scarlet/images/esp-aarch64-coachz.img"
cmdline = "root=/dev/usbblk0p2 rootfstype=ext2 rootwait"
deps = ["initramfs"]

[[images.boot.layers]]
kind = "image"
source = "initramfs"
to = "/boot/initramfs"

[images.disk]
format = "gpt"
output = ".scarlet/images/scarlet-aarch64-coachz-full.img"
deps = ["boot", "rootfs"]

[[images.disk.partitions]]
source = "boot"
name = "SCARLET_BOOT"
type = "efi-system"

[[images.disk.partitions]]
source = "rootfs"
name = "SCARLET_ROOT"
type = "linux-filesystem"
