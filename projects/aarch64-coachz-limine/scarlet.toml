schema_version = 2

[project]
name = "scarlet-aarch64-coachz-limine"

[hooks.post-image]
command = "tools/inject-limine-efi.sh"

[bsp]
path = "bsp"
package = "scarlet"

[bsp.kernel]
source = { git = "https://github.com/petitstrawberry/Scarlet", branch = "dev", package = "scarlet" }
features = { network = true, user-fpu = true, user-vector = true, hypervisor = false, limine = true, sync-debug = true }

[modules]
"scarlet-driver-qcom-sc7180-tlmm" = { path = "../../drivers/gpio/qcom-sc7180-tlmm", enabled = true }
"scarlet-driver-qcom-geni-i2c" = { path = "../../drivers/i2c/qcom-geni", enabled = true }
"scarlet-driver-qcom-geni-spi" = { path = "../../drivers/spi/qcom-geni", enabled = true }
"scarlet-driver-cros-ec-spi" = { path = "../../drivers/platform/chromeos/cros-ec-spi", enabled = true }
"scarlet-driver-qcom-sc7180-dispcc" = { path = "../../drivers/clk/qcom-sc7180-dispcc", enabled = true }
"scarlet-driver-ti-sn65dsi86" = { path = "../../drivers/display/bridge/ti-sn65dsi86", enabled = true }
"scarlet-driver-qcom-sc7180-mdss" = { path = "../../drivers/display/qcom-sc7180-mdss", enabled = true }

[images]

[images.initramfs]
format = "newc"
output = ".scarlet/images/initramfs-aarch64-coachz.cpio"

[[images.initramfs.layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/Scarlet", branch = "dev" }
subdir = "bundles/base"
bundle = "bundle.toml"

[[images.initramfs.layers]]
kind = "bundle"
source = { git = "https://github.com/petitstrawberry/Scarlet", branch = "dev" }
subdir = "bundles/cli-utils"
bundle = "bundle.toml"

[images.boot]
format = "limine-uefi"
output = ".scarlet/images/esp-aarch64-coachz.img"
cmdline = "rootwait"
deps = ["initramfs"]

[[images.boot.layers]]
kind = "image"
source = "initramfs"
to = "/boot/initramfs"
