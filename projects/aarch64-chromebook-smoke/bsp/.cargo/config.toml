[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3

[target.aarch64-linux-image]
rustflags = [
    "-C", "link-arg=-Tlds/aarch64_linux.ld",
    "-C", "no-vectorize-loops",
    "-C", "no-vectorize-slp",
]

# The smoke project is one directory level farther from the sibling Scarlet
# checkout than Scarlet's in-tree Limine project.
[build]
target = "targets/aarch64-linux-image.json"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
unstable-options = true
