# Linux arm64 Image compile harness. vboot packaging remains a separate step.
schema_version = 2

[project]
name = "scarlet-aarch64-chromebook-linux"

[bsp]
path = "bsp"
package = "scarlet"

[bsp.kernel]
source = { path = "../../../Scarlet/kernel" }
features = { network = true, user-fpu = true, user-vector = true, hypervisor = false, linux-boot = true, sync-debug = true }

[images]

# A small valid initramfs build target for cargo-scarlet's image path.  It is
# intentionally empty: this project is a compile smoke test, not a rootfs or
# deployable storage image.
[images.initramfs]
format = "newc"
output = ".scarlet/images/initramfs-aarch64-chromebook-smoke.cpio"
