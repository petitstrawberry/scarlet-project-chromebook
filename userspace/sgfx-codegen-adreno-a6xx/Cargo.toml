[package]
name = "sgfx-codegen-adreno-a6xx"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[lib]
path = "src/lib.rs"

[features]
programmable = ["dep:sgfx-shader-ir3"]

[dependencies]
sgfx-shader-ir3 = { path = "../sgfx-shader-ir3", default-features = false, optional = true }
adreno-a6xx-layout = { path = "../../shared/adreno-a6xx-layout" }
adreno-a6xx-pm4 = { path = "../../shared/adreno-a6xx-pm4" }
adreno-a6xx-shader-pack = { path = "../../shared/adreno-a6xx-shader-pack" }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "9dfbec263fae939e06985277d13f899a60fe3d63", default-features = false }

[dev-dependencies]
serde_json = "1"
