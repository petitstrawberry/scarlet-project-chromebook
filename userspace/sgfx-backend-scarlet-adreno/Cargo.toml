[package]
name = "sgfx-backend-scarlet-adreno"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[features]
default = ["scarlet-std"]
std = ["dep:scarlet-os", "gpu-raw/std"]
scarlet-std = ["dep:scarlet-std", "gpu-raw/scarlet-std"]

[dependencies]
adreno-a6xx-layout = { path = "../../shared/adreno-a6xx-layout" }
adreno-a6xx-submit-wire = { path = "../../shared/adreno-a6xx-submit-wire" }
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "af2bb5e8d062fef5558f106bc55c21c1f512b7f4", package = "gpu-raw", default-features = false }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "af2bb5e8d062fef5558f106bc55c21c1f512b7f4", package = "scarlet-os", default-features = false, features = ["std"], optional = true }
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "af2bb5e8d062fef5558f106bc55c21c1f512b7f4", package = "scarlet-std", optional = true }
sgfx-codegen-adreno-a6xx = { path = "../sgfx-codegen-adreno-a6xx" }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "34a47c701fa0d4761f63f3d841c7d312cea45236", default-features = false }

[lib]
name = "sgfx_backend_scarlet_adreno"
path = "src/lib.rs"
