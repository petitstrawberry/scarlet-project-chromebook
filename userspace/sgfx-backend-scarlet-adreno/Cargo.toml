[package]
name = "sgfx-backend-scarlet-adreno"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[features]
default = ["scarlet-std"]
std = ["dep:scarlet-os", "gpu-raw/std"]
scarlet-std = ["dep:scarlet-std", "gpu-raw/scarlet-std"]
# Native std supplies monotonic timing and best-effort stderr diagnostics.
# Direct backend builds must also pass --no-default-features (as for std).
profile-submissions = ["std"]
programmable = ["std", "dep:sgfx-shader-ir3", "dep:serde_json", "sgfx-codegen-adreno-a6xx/programmable"]

[dependencies]
serde_json = {version="1",optional=true}
adreno-a6xx-layout = { path = "../../shared/adreno-a6xx-layout" }
adreno-a6xx-submit-wire = { path = "../../shared/adreno-a6xx-submit-wire" }
gpu-raw = { git = "https://github.com/petitstrawberry/Scarlet", rev = "7da991683ec9fcdb8368773cc93e6d6044fd2b0e", package = "gpu-raw", default-features = false }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "7da991683ec9fcdb8368773cc93e6d6044fd2b0e", package = "scarlet-os", default-features = false, features = ["std"], optional = true }
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "7da991683ec9fcdb8368773cc93e6d6044fd2b0e", package = "scarlet-std", optional = true }
sgfx-codegen-adreno-a6xx = { path = "../sgfx-codegen-adreno-a6xx" }
sgfx-shader-ir3 = { path = "../sgfx-shader-ir3", optional = true }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "9dfbec263fae939e06985277d13f899a60fe3d63", default-features = false }

[lib]
name = "sgfx_backend_scarlet_adreno"
path = "src/lib.rs"

[dev-dependencies]
serde_json = "1"
