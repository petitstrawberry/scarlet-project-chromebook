[package]
name = "sgfx-adreno-check"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[dependencies]
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "61e5ddd0f0e31309d2468ace3c4afe67d949fa72", default-features = false, features = ["scarlet-native-api"] }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "61e5ddd0f0e31309d2468ace3c4afe67d949fa72", default-features = false, features = ["std", "backend-abi"] }
sgfx-backend-abi = { git = "https://github.com/petitstrawberry/sgfx", rev = "61e5ddd0f0e31309d2468ace3c4afe67d949fa72" }
sgfx-backend-loader = { git = "https://github.com/petitstrawberry/sgfx", rev = "61e5ddd0f0e31309d2468ace3c4afe67d949fa72" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

[profile.release]
panic = "abort"

[target.'cfg(target_os = "scarlet")'.dependencies]
# Legal, immutable NV12 producer for --nv12-only; no test-only kernel ABI.
scarlet-video-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "fbaacb832f38729f8a8210bbcd1b2c25dad45b99", default-features = false, features = ["std", "h264-stateful-hw"] }
