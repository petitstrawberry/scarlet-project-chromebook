[package]
name = "sgfx-adreno-check"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[dependencies]
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "9dfbec263fae939e06985277d13f899a60fe3d63", default-features = false, features = ["scarlet-native-api"] }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "9dfbec263fae939e06985277d13f899a60fe3d63", default-features = false, features = ["std", "backend-abi"] }
sgfx-backend-abi = { git = "https://github.com/petitstrawberry/sgfx", rev = "9dfbec263fae939e06985277d13f899a60fe3d63" }
sgfx-backend-loader = { git = "https://github.com/petitstrawberry/sgfx", rev = "9dfbec263fae939e06985277d13f899a60fe3d63" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

[profile.release]
panic = "abort"

[target.'cfg(target_os = "scarlet")'.dependencies]
# Legal, immutable NV12 producer for --nv12-only; no test-only kernel ABI.
scarlet-video-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "dca6e01a1b3f751e10ad42d01de6bad669bae5c3", default-features = false, features = ["std", "h264-stateful-hw"] }
