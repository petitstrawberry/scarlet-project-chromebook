[package]
name = "a618-submit-validation-tests"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[features]
default = ["strict-command-validation"]
strict-command-validation = []

[lib]
path = "src/lib.rs"

[dependencies]
adreno-a6xx-layout = { path = "../../shared/adreno-a6xx-layout" }
adreno-a6xx-pm4 = { path = "../../shared/adreno-a6xx-pm4" }
adreno-a6xx-shader-pack = { path = "../../shared/adreno-a6xx-shader-pack" }
adreno-a6xx-submit-wire = { path = "../../shared/adreno-a6xx-submit-wire" }

[dev-dependencies]
sgfx-codegen-adreno-a6xx = { path = "../../userspace/sgfx-codegen-adreno-a6xx" }
sgfx-core = { git = "https://github.com/petitstrawberry/sgfx", rev = "040dbb5cf42b75489504e1765183d37f6131f54c", default-features = false }
